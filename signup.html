<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency 365 - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9fbfc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0f172a;
            --accent-hover: #334155;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #111726;
            --bg-card: #1a2238;
            --text-primary: #f3f5ee;
            --text-secondary: #a0aabf;
            --border-color: #2b354d;
            --input-bg: #151b2d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            /* Clean background */
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 4rem 1rem 2rem;
            box-sizing: border-box;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            position: relative;
        }

        .back-home {
            position: absolute;
            top: -2.5rem;
            left: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }
        .back-home:hover {
            color: var(--text-primary);
        }

        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            text-align: center;
            box-sizing: border-box;
            width: 100%;
        }

        .auth-box h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        .auth-box h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin: 1.5rem 0 0.5rem 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .auth-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        .primary-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-sizing: border-box;
            margin-top: 1rem;
            font-family: inherit;
        }

        .primary-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(109, 149, 57, 0.15);
        }

        .pin-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: left;
        }
        .pin-error.show {
            display: block;
        }
    </style>
    <script>
        // Prevent FOUC by applying theme & brand settings synchronously before first paint
        (function() {
            // Theme
            const savedTheme = localStorage.getItem('agency365_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            // Colors
            const primaryColor = localStorage.getItem('agency365_brand_primary') || '#12b76a';
            const secondaryColor = localStorage.getItem('agency365_brand_secondary') || '#e5eed7';
            document.documentElement.style.setProperty('--accent-color', primaryColor);
            document.documentElement.style.setProperty('--accent-hover', primaryColor === '#12b76a' ? '#0e9f5d' : primaryColor);
            document.documentElement.style.setProperty('--secondary-color', secondaryColor);
            
            // Logo Size
            const logoHeight = localStorage.getItem('agency365_logo_height') || '30';
            document.documentElement.style.setProperty('--logo-height', logoHeight + 'px');
        })();
    </script>
</head>
<body class="preload">
    <div class="auth-container">
        <!-- Back Link -->
        <a href="index.html" class="back-home">← Back to Home</a>
        
        <div class="auth-box">
            <h1>Agency 365</h1>
            <h2>Create Your Account</h2>
            <p>Sign up to start managing your agency for free.</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label>Organization Name</label>
                    <input type="text" id="signup-org" placeholder="Acme Agency" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" placeholder="john@acme.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Min 8 characters" required minlength="8">
                </div>
                
                <p id="auth-error" class="pin-error"></p>
                <button type="submit" class="primary-btn">Sign Up</button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.9rem; margin-bottom: 0;">
                Already have an account? <a href="login.html" style="color: var(--accent-color); text-decoration: none; font-weight: 600;">Log In</a>
            </p>
        </div>
    </div>
    
    <script type="module" src="app.js?v=20260615"></script>
</body>
</html>
