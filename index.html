<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency365 - Simplified with AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Modern Geometric Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fef8f4; /* Soft peach/cream */
            --nav-bg: #1d1d1f;
            --text-dark: #1d1d1f;
            --text-light: #ffffff;
            --text-muted: #6e6e73;
            --accent: #e28743;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(180deg, #fef8f4 0%, #ffffff 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.04em;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Floating Pill Navbar */
        .saas-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.6rem 0.6rem 1.5rem;
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: var(--nav-bg);
            border-radius: 100px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }
        .saas-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .saas-nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .saas-nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .saas-nav-links a:hover {
            color: var(--text-light);
        }
        .saas-btn-signup {
            background: #ffffff;
            color: var(--text-dark) !important;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-weight: 600 !important;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s ease;
        }
        .saas-btn-signup:hover {
            transform: scale(1.02);
        }

        /* Hero Section */
        .hero {
            padding: 12rem 5% 4rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-pre {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: -0.5rem;
        }
        .hero h1 {
            font-size: 5.5rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }
        .hero h1 span.gradient {
            background: linear-gradient(90deg, #1d1d1f 0%, #1d1d1f 60%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero h1 span.dot {
            color: var(--accent);
        }
        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-large {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--nav-bg);
            color: var(--text-light);
            padding: 1rem 2rem;
            border-radius: 100px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }

        .ratings {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .stars { color: #f59e0b; letter-spacing: 2px; }

        .hero-image-wrapper {
            margin: 4rem auto 0;
            max-width: 1000px;
            position: relative;
        }
        .hero-image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Decoration marks like Image 4 */
        .corner-mark {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid var(--accent);
            border-radius: 12px;
            opacity: 0.6;
        }
        .cm-tl { top: -20px; left: -20px; border-right: none; border-bottom: none; }
        .cm-tr { top: -20px; right: -20px; border-left: none; border-bottom: none; }
        .cm-bl { bottom: -20px; left: -20px; border-right: none; border-top: none; }
        .cm-br { bottom: -20px; right: -20px; border-left: none; border-top: none; }

        @media (max-width: 768px) {
            .hero-pre { font-size: 1.8rem; }
            .hero h1 { font-size: 3.5rem; }
            .saas-nav-links a:not(.saas-btn-signup) { display: none; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="saas-nav">
        <a href="#" class="saas-logo">Agency365</a>
        <div class="saas-nav-links">
            <a href="login.html">Log In</a>
            <a href="signup.html" class="saas-btn-signup">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                Get Started
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-pre">Run your agency</div>
        <h1>Simplified with <span class="gradient">Agency365<span class="dot">.</span></span></h1>
        
        <p>Discover the power of an all-in-one platform to enable healthier client relationships, better cashflow, and scalable growth.</p>
        
        <a href="signup.html" class="btn-large">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            Launch Workspace
        </a>
        
        <div class="ratings">
            <span class="stars">★★★★★</span>
            <span>4.8/5 by modern agencies globally</span>
        </div>

        <div class="hero-image-wrapper">
            <div class="corner-mark cm-tl"></div>
            <div class="corner-mark cm-tr"></div>
            <div class="corner-mark cm-bl"></div>
            <div class="corner-mark cm-br"></div>
            
            <!-- A placeholder for the dashboard split view (like the food plate) -->
            <div style="background: white; border-radius: 24px; padding: 2rem; display: flex; gap: 2rem; min-height: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); overflow: hidden; position: relative;">
                
                <div style="flex:1; background: linear-gradient(135deg, #fdfbf7 0%, #fef8f4 100%); border-radius: 16px; padding: 2rem;">
                    <h3 style="margin-top:0; font-size:1.5rem;">Chaos</h3>
                    <div style="height: 12px; background: rgba(0,0,0,0.05); border-radius: 6px; margin-bottom: 1rem; width: 80%;"></div>
                    <div style="height: 12px; background: rgba(0,0,0,0.05); border-radius: 6px; margin-bottom: 1rem; width: 60%;"></div>
                    <div style="height: 12px; background: rgba(0,0,0,0.05); border-radius: 6px; margin-bottom: 2rem; width: 90%;"></div>
                    
                    <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                        <div style="width: 100px; height: 100px; background: rgba(240,68,56,0.1); border: 1px dashed rgba(240,68,56,0.3); border-radius: 12px;"></div>
                        <div style="width: 100px; height: 100px; background: rgba(245,158,11,0.1); border: 1px dashed rgba(245,158,11,0.3); border-radius: 12px;"></div>
                    </div>
                </div>

                <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--accent); transform: translateX(-50%); z-index: 10;"></div>

                <div style="flex:1; background: #ffffff; border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                    <h3 style="margin-top:0; font-size:1.5rem;">Clarity</h3>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                        <div style="flex:1; height: 80px; background: rgba(18,183,106,0.1); border-radius: 12px;"></div>
                        <div style="flex:1; height: 80px; background: rgba(18,183,106,0.1); border-radius: 12px;"></div>
                    </div>
                    <div style="height: 120px; background: linear-gradient(180deg, rgba(59,130,246,0.1) 0%, rgba(59,130,246,0) 100%); border-top: 3px solid #3b82f6; border-radius: 12px;"></div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
